services:
  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    image: azure-rag-platform-api:local
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      API_TITLE: Azure RAG Platform API
      API_VERSION: 0.1.0
      OTEL_SERVICE_NAME: rag-api
      APPLICATIONINSIGHTS_CONNECTION_STRING: ""
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-google}
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-3.6-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_OUTPUT_DIMENSIONALITY: ${GEMINI_EMBEDDING_OUTPUT_DIMENSIONALITY:-768}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-documents}
      QDRANT_API_KEY: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: app/worker/Dockerfile
    image: azure-rag-platform-worker:local
    depends_on:
      azurite:
        condition: service_started
      qdrant-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      OTEL_SERVICE_NAME: rag-worker
      APPLICATIONINSIGHTS_CONNECTION_STRING: ""
      FUNCTIONS_WORKER_RUNTIME: python
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-google}
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      AzureWebJobsStorage: ${COMPOSE_AZURE_WEBJOBS_STORAGE:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;}
      INGESTION_QUEUE_NAME: ${INGESTION_QUEUE_NAME:-documents-to-ingest}
      DOCUMENTS_CONTAINER_NAME: ${DOCUMENTS_CONTAINER_NAME:-documents}
      DOCUMENT_METADATA_TABLE_NAME: ${DOCUMENT_METADATA_TABLE_NAME:-DocumentMetadata}
      WORKER_RETRY_LIMIT: ${WORKER_RETRY_LIMIT:-5}
      AzureFunctionsJobHost__extensions__queues__maxDequeueCount: ${AzureFunctionsJobHost__extensions__queues__maxDequeueCount:-5}
      AzureFunctionsJobHost__extensions__queues__visibilityTimeout: ${AzureFunctionsJobHost__extensions__queues__visibilityTimeout:-00:00:30}
      DOCUMENT_CHUNK_MAX_CHARS: ${DOCUMENT_CHUNK_MAX_CHARS:-1200}
      DOCUMENT_CHUNK_OVERLAP_CHARS: ${DOCUMENT_CHUNK_OVERLAP_CHARS:-200}
      OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-3.6-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_OUTPUT_DIMENSIONALITY: ${GEMINI_EMBEDDING_OUTPUT_DIMENSIONALITY:-768}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-documents}
      QDRANT_API_KEY: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WORKER_PORT:-7071}:80"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.3-unprivileged
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  qdrant-init:
    image: curlimages/curl:8.16.0
    depends_on:
      - qdrant
    environment:
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-documents}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-768}
    command:
      - sh
      - -c
      - |
        until curl -fsS http://qdrant:6333/ >/dev/null; do
          sleep 1
        done

        if curl -fsS "http://qdrant:6333/collections/$${QDRANT_COLLECTION_NAME}" >/dev/null 2>&1; then
          exit 0
        fi

        curl -fsS -X PUT "http://qdrant:6333/collections/$${QDRANT_COLLECTION_NAME}" \
          -H "content-type: application/json" \
          -d "{\"vectors\":{\"size\":$${QDRANT_VECTOR_SIZE},\"distance\":\"Cosine\"}}"
    restart: "no"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data
      - --skipApiVersionCheck
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
      - "${AZURITE_QUEUE_PORT:-10001}:10001"
      - "${AZURITE_TABLE_PORT:-10002}:10002"
    volumes:
      - azurite_data:/data
    restart: unless-stopped

volumes:
  azurite_data:
  qdrant_storage:
