[project]
name = "azure-rag-platform"
version = "0.1.0"
description = "Cloud-native Azure RAG platform with separate application, shared RAG, and infrastructure concerns."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "rag-api",
    "rag-core",
]

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.5",
]

[tool.uv]
package = false

[tool.uv.sources]
rag-api = { workspace = true }
rag-core = { workspace = true }

[tool.uv.workspace]
members = [
    "app/api",
    "packages/rag_core",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "app/api/tests",
    "app/worker/tests",
    "packages/rag_core/tests",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = [
    "app/api/src",
    "app/api/tests",
    "packages/rag_core/src",
    "packages/rag_core/tests",
]
extraPaths = [
    "app/api/src",
    "packages/rag_core/src",
]
exclude = [
    ".venv",
    "**/__pycache__",
]
